
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Library</title>
    <link rel="stylesheet" href="css/authantication.css">
</head>

<body>

    <nav class="navbar">

        <a href="index.html" class="brand">
            <img src="images/book-logo-template_23-2149676836.avif" alt="Library Logo">
            <span>Online Library</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="Login.html">Login</a>
            <a href="signUp.html">Sign Up</a>
    
            <a href="Catalogue.html">Browse Books</a>
            
        </div>

    </nav>

    <div class="login-container">

        <div class="login-box">

            <h1>Welcome Back</h1>
            <p>Login to access your library account.</p>

            <form>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" formaction="Catalogue%20.html"
                    class="login-button">
                    Login as User
                </button>

                <button type="submit" formaction="admin.html"
                    class="login-button admin-button">
                    Login as Admin
                </button>

            </form>

            <div class="register-link">
                Don't have an account?
                <a href="signUp.html">Create Account</a>
            </div>

            <div class="back-home">
                <a href="index.html">Back to Home</a>
            </div>

        </div>

    </div>

</body>

</html>
