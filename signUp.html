
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Online Library</title>
    <link rel="stylesheet" href="css/authantication.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <a href="index.html" class="brand">
            <img src="images/book-logo-template_23-2149676836.avif" alt="Library Logo">
            <span>Online Library</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="Login.html">Login</a>
            <a href="signUp.html">Sign Up</a>
            
            <a href="Catalogue.html">Browse Books</a>
           
        </div>

    </nav>

    <!-- Sign Up Form -->
    <div class="login-container">

        <div class="login-box">

            <h1>Create Account</h1>

            <p>Join our library and discover your next favorite book.</p>

            <form action="Login.html" method="get">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Confirm your password" required>
                </div>

                <!-- Account Type -->
                <div class="form-group">

                    <label>Account Type</label>

                    <div class="role-options">

                        <label>
                            <input type="radio" name="role" value="user" checked>
                            User
                        </label>

                        <label>
                            <input type="radio" name="role" value="admin">
                            Admin
                        </label>

                    </div>

                </div>

                <button type="submit" class="login-button">
                    Create Account
                </button>

            </form>

            <div class="register-link">
                Already have an account?
                <a href="Login.html">Login</a>
            </div>

            <div class="back-home">
                <a href="index.html">Back to Home</a>
            </div>

        </div>

    </div>

</body>

</html>
