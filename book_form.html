<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add / Edit Book - Online Library</title>
    <link rel="stylesheet" href="css/book_form.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <a href="admin.html" class="brand">
            <img src="images/book-logo-template_23-2149676836.avif" alt="Library Logo">
            <span>Online Library - Admin</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="Login.html">Logout</a>
            <a href="admin.html">Dashboard</a>
            <a href="Catalogue.html">Book Catalogue</a>
            
        </div>

    </nav>

    <!-- Book Form -->
    <section class="book-form-container">

        <div class="book-form-box">

            <h1>Add New Book</h1>

            <p>Enter the book information below.</p>

            <form action="admin.html" method="get">

                <div class="form-group">
                    <label>Book Title</label>
                    <input type="text" placeholder="Enter book title" required>
                </div>

                <div class="form-group">
                    <label>Author</label>
                    <input type="text" placeholder="Enter author name" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select required>
                        <option value="">Select Category</option>
                        <option>Fiction</option>
                        <option>Science</option>
                        <option>History</option>
                        <option>Technology</option>
                        <option>Self Development</option>
                        <option>Finance</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea placeholder="Enter book description" rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label>Book Status</label>
                    <select required>
                        <option value="Available">Available</option>
                        <option value="Borrowed">Borrowed</option>
                    </select>
                </div>

                <button type="submit" class="save-book-btn">
                    Save Book
                </button>

                <a href="admin.html" class="cancel-book-btn">
                    Cancel
                </a>

            </form>

        </div>

    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 Online Library. All Rights Reserved.</p>
    </footer>

</body>

</html>
